name: Blocktorch
description: >-
  Blocktorch is an end-to-end observability platform built specifically for
  web3 services and decentralized applications (dApps). It gives engineering
  teams real-time monitoring of smart contract events, state variables and
  transaction data, plus log search, alerting, tracing, dashboarding, debugging
  and collaboration across multiple layers of the web3 stack (EVM chains,
  roll-ups, local Hardhat forks, oracles, account-abstraction modules and
  decentralized storage). Blocktorch also exposes a Hardhat Forking API for
  programmatically managing managed Hardhat fork instances for continuous
  development and testing. Backed by Speedinvest.
